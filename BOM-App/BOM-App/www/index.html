<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<link rel="icon" type="image/png" href="img/icone-bom.png">
<link rel="apple-touch-icon" href="img/icone-bom.png">
<title>BOM! — Organizador de PDFs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<!-- Bibliotecas: pdf.js (ler PDFs) e jsPDF (gerar PDFs). Usa a cópia local em libs/ (app Android) e, se não existir, a internet. -->
<script>
(function () {
  var L = [['libs/pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'], ['libs/pdf.worker.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'], ['libs/jspdf.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']];
  function add(src, ok, fail) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }
  function load(i) { if (i >= L.length) return; add(L[i][0], function () { window.BOM_LIBS_LOCAL = true; load(i + 1); }, function () { add(L[i][1], function () { load(i + 1); }, function () { load(i + 1); }); }); }
  if (location.protocol === 'file:') { (function cdn(i) { if (i < L.length) add(L[i][1], function () { cdn(i + 1); }, function () { cdn(i + 1); }); })(0); } else load(0);
})();
</script>
</head>
<body>
<div class="phone">
  <div id="app"></div>
  <div id="float-layer"></div>
  <div id="selpop"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
</div>
<div id="drag-holder"></div>
<input type="file" id="file-in" multiple hidden>
<input type="file" id="img-in" accept="image/*" hidden>
<script src="js/app.js"></script>
</body>
</html>

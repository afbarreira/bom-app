<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<link rel="icon" type="image/png" href="img/icone-bom.png">
<link rel="apple-touch-icon" href="img/icone-bom.png">
<title>BOM! — Organizador de PDFs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<!-- Configuração da nuvem: Supabase ou Firebase (deixe os dois null para o modo local) -->
<script src="js/firebase-config.js"></script>
<script src="js/supabase-config.js"></script>
<!-- Bibliotecas: pdf.js (ler PDFs), jsPDF (gerar PDFs), pdf-lib (gravar anotações) e Firebase (nuvem).
     Usa a cópia local em libs/ (app Android) e, se não existir, a internet. -->
<script>
(function () {
  var CDN = 'https://cdnjs.cloudflare.com/ajax/libs/', FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var L = [['libs/pdf.min.js', CDN + 'pdf.js/3.11.174/pdf.min.js'], ['libs/pdf.worker.min.js', CDN + 'pdf.js/3.11.174/pdf.worker.min.js'],
           ['libs/jspdf.umd.min.js', CDN + 'jspdf/2.5.1/jspdf.umd.min.js'], ['libs/pdf-lib.min.js', CDN + 'pdf-lib/1.17.1/pdf-lib.min.js']];
  if (window.BOM_SUPABASE_CONFIG) L.push(['libs/supabase.js', 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js']);
  else if (window.BOM_FIREBASE_CONFIG) L.push(['libs/firebase-app-compat.js', FB + 'firebase-app-compat.js'], ['libs/firebase-auth-compat.js', FB + 'firebase-auth-compat.js'], ['libs/firebase-firestore-compat.js', FB + 'firebase-firestore-compat.js']);
  var local = location.protocol !== 'file:';
  window.BOM_LIBS = new Promise(function (done) {
    function add(src, ok, fail) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); }
    function load(i) {
      if (i >= L.length) return done();
      var next = function () { load(i + 1); };
      if (local) add(L[i][0], function () { window.BOM_LIBS_LOCAL = true; next(); }, function () { add(L[i][1], next, next); });
      else add(L[i][1], next, next);
    }
    load(0);
  });
})();
</script>
</head>
<body>
<div class="phone">
  <div id="app"></div>
  <div id="float-layer"></div>
  <div id="selpop"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
</div>
<div id="drag-holder"></div>
<input type="file" id="file-in" multiple hidden>
<input type="file" id="img-in" accept="image/*" hidden>
<script src="js/persistencia.js"></script>
<script src="js/app.js"></script>
</body>
</html>

name: Gerar APK do BOM!

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BOM-App/BOM-App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licenças do Android (SDK já vem instalado)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências
        run: npm install

      - name: Preparar projeto Android (bibliotecas, ícones e sincronização)
        run: npm run prepare:android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BOM-Organizador.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BOM-Organizador-APK
          path: BOM-App/BOM-App/BOM-Organizador.apk
